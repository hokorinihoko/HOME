<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="HOME - ここから始まる、あなたのホームページ。">
	<title>HOME | Welcome</title>
	<style>
		:root {
			--ink: #17324d;
			--muted: #60758a;
			--paper: #f7f5ef;
			--accent: #ef7657;
			--line: #d9e0df;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			color: var(--ink);
			background: var(--paper);
			font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
			line-height: 1.7;
		}

		.page {
			width: min(1080px, calc(100% - 40px));
			margin: 0 auto;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 28px 0;
			border-bottom: 1px solid var(--line);
		}

		.logo {
			color: var(--ink);
			font-family: Georgia, serif;
			font-size: 1.3rem;
			font-weight: bold;
			letter-spacing: .16em;
			text-decoration: none;
		}

		nav { display: flex; gap: 24px; }
		nav a { color: var(--muted); font-size: .9rem; text-decoration: none; }
		nav a:hover { color: var(--accent); }

		.hero {
			display: grid;
			grid-template-columns: 1.2fr .8fr;
			align-items: center;
			gap: 64px;
			min-height: 500px;
			padding: 72px 0;
		}

		.eyebrow {
			color: var(--accent);
			font-size: .8rem;
			font-weight: bold;
			letter-spacing: .18em;
		}

		h1 {
			max-width: 620px;
			margin: 14px 0 20px;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(3.6rem, 9vw, 7.4rem);
			letter-spacing: -.05em;
			line-height: .92;
		}

		.lead { max-width: 440px; color: var(--muted); font-size: 1.05rem; }

		.button {
			display: inline-block;
			margin-top: 18px;
			padding: 12px 22px;
			border: 1px solid var(--ink);
			color: var(--ink);
			font-size: .9rem;
			text-decoration: none;
			transition: .2s ease;
		}

		.button:hover { color: white; background: var(--ink); }

		.orb {
			display: grid;
			place-items: center;
			width: min(330px, 80vw);
			aspect-ratio: 1;
			margin-left: auto;
			border-radius: 48% 52% 58% 42%;
			background: var(--accent);
			color: white;
			font-family: Georgia, serif;
			font-size: 4rem;
			transform: rotate(-8deg);
		}

		.orb span { transform: rotate(8deg); }

		.links {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 16px;
			padding: 32px 0 72px;
		}

		.link-card {
			padding: 24px;
			border-top: 2px solid var(--ink);
			color: var(--ink);
			text-decoration: none;
		}

		.link-card:hover { border-color: var(--accent); background: #efebe2; }
		.link-card strong { display: block; margin-bottom: 6px; font-family: Georgia, serif; font-size: 1.35rem; }
		.link-card small { color: var(--muted); }

		footer { padding: 20px 0 36px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }

		@media (max-width: 700px) {
			.page { width: min(100% - 28px, 540px); }
			header { padding: 20px 0; }
			nav { gap: 12px; }
			.hero { grid-template-columns: 1fr; gap: 28px; min-height: auto; padding: 72px 0 48px; }
			.orb { width: 190px; margin: 0 12px 0 auto; font-size: 2.5rem; }
			.links { grid-template-columns: 1fr; padding-bottom: 48px; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header>
			<a class="logo" href="index.html">HOME</a>
			<nav aria-label="メインメニュー">
				<a href="#about">About</a>
				<a href="#links">Links</a>
			</nav>
		</header>

		<main>
			<section class="hero" id="about">
				<div>
					<span class="eyebrow">WELCOME TO MY SPACE</span>
					<h1>ここが、<br>HOME。</h1>
					<p class="lead">日々のこと、つくったもの、好きなもの。ここから、ゆっくり紹介していきます。</p>
					<a class="button" href="#links">リンクを見る →</a>
				</div>
				<div class="orb" aria-hidden="true"><span>hello.</span></div>
			</section>

			<section class="links" id="links" aria-label="リンク一覧">
				<a class="link-card" href="#">
					<strong>About me</strong>
					<small>わたしについて →</small>
				</a>
				<a class="link-card" href="#">
					<strong>Works</strong>
					<small>つくったもの →</small>
				</a>
				<a class="link-card" href="mailto:hello@example.com">
					<strong>Contact</strong>
					<small>お問い合わせ →</small>
				</a>
			</section>
		</main>

		<footer>© 2026 HOME</footer>
	</div>
</body>
</html>
